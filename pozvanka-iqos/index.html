<style>

  body { margin: 0; }
  img { max-width: 100%; }

<title>Pozvánka na iqos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@500;600&display=swap">
<style>
  /* Layout: jedna obrazovka, otázka uprostřed; po „Ano“ hláška, fotka a výzva. Jediný akcent = žhavá oranžová. */
  :root {
    --bg: #e8ecf0;
    --surface: #fbfcfd;
    --ink: #16202b;
    --muted: #5a6673;
    --line: #d2d9e0;
    --heat: #d9480f;
    --on-heat: #ffffff;
    --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1318; --surface: #161d25; --ink: #e7ecf1; --muted: #93a0ad; --line: #26313c;
      --heat: #ff7b3a; --on-heat: #1a0d05;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1318; --surface: #161d25; --ink: #e7ecf1; --muted: #93a0ad; --line: #26313c;
    --heat: #ff7b3a; --on-heat: #1a0d05;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; overflow-x: hidden; }

  .stage {
    min-height: 100%; box-sizing: border-box;
    display: grid; place-items: center; text-align: center;
    padding-block: 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .ask, .yes-screen { display: grid; justify-items: center; gap: 28px; width: 100%; max-width: 640px; }

  .eyebrow { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  h1 {
    margin: 0; font-family: var(--display); font-weight: 800;
    font-size: clamp(40px, 10vw, 76px); line-height: .98; letter-spacing: -.03em; text-wrap: balance;
  }
  .hot { color: var(--heat); }

  .actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn {
    font: 600 20px/1 var(--body); padding: 18px 40px; min-width: 140px; border-radius: 14px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .btn:focus-visible { outline: 3px solid var(--heat); outline-offset: 3px; }
  .btn.primary { background: var(--heat); border-color: var(--heat); color: var(--on-heat); }
  .btn.primary:hover { filter: brightness(1.06); }
  #no.loose { position: fixed; z-index: 5; margin: 0; transition: left .22s ease, top .22s ease; }

  .yes-screen h1 { font-size: clamp(32px, 7.5vw, 56px); }
  .yes-screen h1:focus { outline: none; }
  .photo {
    margin: 0; width: min(100%, 420px); max-width: 100%;
    border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
    box-shadow: 0 24px 50px -28px rgb(10 15 20 / .45);
  }
  .photo img { display: block; width: 100%; height: auto; }
  .go {
    margin: 0; font-family: var(--display); font-weight: 800; color: var(--heat);
    font-size: clamp(44px, 12vw, 88px); line-height: 1; letter-spacing: -.03em;
  }

  @media (prefers-reduced-motion: reduce) { #no.loose { transition: none; } }
</style>
</head>

    <div class="actions">
      <button type="button" class="btn primary" id="yes">Ano</button>
      <button type="button" class="btn" id="no">Ne</button>
    </div>
  </section>

    <p class="go">Tak jdeme.</p>

</main>

<script>
  const $ = id => document.getElementById(id);
  const yes = $('yes'), no = $('no');

  // „Ne“ uletí jinam pokaždé, když se k němu kurzor nebo prst přiblíží
  function flee(e) {
    if (e && e.cancelable) e.preventDefault();
    const m = 16, vw = window.innerWidth, vh = window.innerHeight;
    const r = no.getBoundingClientRect(), y = yes.getBoundingClientRect();
    const maxX = Math.max(m, vw - r.width - m), maxY = Math.max(m, vh - r.height - m);
    let x = m, top = m;
    for (let i = 0; i < 80; i++) {
      const cx = m + Math.random() * (maxX - m), cy = m + Math.random() * (maxY - m);
      const hitsYes = cx < y.right + 12 && cx + r.width > y.left - 12 && cy < y.bottom + 12 && cy + r.height > y.top - 12;
      const tooClose = Math.hypot(cx - r.left, cy - r.top) < 140;
      if (!hitsYes && !tooClose) { x = cx; top = cy; break; }
    }
    if (!no.classList.contains('loose')) {
      no.style.left = r.left + 'px';
      no.style.top = r.top + 'px';
      no.classList.add('loose');
      no.getBoundingClientRect();
    }
    no.style.left = x + 'px';
    no.style.top = top + 'px';
  }

  no.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') flee(); });
  no.addEventListener('pointerdown', flee);
  no.addEventListener('click', e => { e.preventDefault(); if (e.detail === 0) flee(); });
  window.addEventListener('resize', () => { if (no.classList.contains('loose')) flee(); });

  yes.addEventListener('click', () => {
    $('ask').hidden = true;
    $('yesScreen').hidden = false;
    $('yesTitle').focus();
  });
</script>
